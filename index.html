<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Party Time!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/png" href="assets/cursors/pink-bass.png?v=2">
    <link rel="icon" type="image/png" href="assets/cursors/rainbow-bass.png?v=2">
</head>
<body>
    <div id="container">
        <!-- Parking Lot Screen -->
        <div id="screen2" class="screen parking-lot active">
            <a href="welcome.html" id="back-btn-2" class="back-btn">← back</a>
            <div id="page-in-progress">
                <img src="assets/images/titles/aug-7.png" alt="August 7">
            </div>
            <a href="activities.html" id="activities-btn" class="nav-btn" style="top: 55%; left: 15%;">
                activities
            </a>
            <a href="accommodations.html" id="accommodations-btn" class="nav-btn" style="top: 60%; left: 15%;">
                accommodations
            </a>
<a href="schedule.html" id="schedule-btn" class="nav-btn" style="top: 70%; left: 15%;">
                schedule
            </a>
            <a href="reception.html" id="reception-btn" class="nav-btn" style="top: 75%; left: 15%;">
                reception
            </a>
        </div>

        <!-- Cursor Selector -->
        <div id="cursor-selector">
            <button class="cursor-btn" data-cursor="pink-bass" title="Pink">
                <img src="assets/cursors/pink-bass.png" alt="Pink">
            </button>
            <button class="cursor-btn" data-cursor="green-bass" title="Green">
                <img src="assets/cursors/green-bass.png" alt="Green">
            </button>
            <button class="cursor-btn" data-cursor="yellow-bass" title="Yellow">
                <img src="assets/cursors/yellow-bass.png" alt="Yellow">
            </button>
            <button class="cursor-btn" data-cursor="rainbow-bass" title="Rainbow">
                <img src="assets/cursors/rainbow-bass.png" alt="Rainbow">
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
