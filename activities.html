<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - It's Party Time!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/png" href="assets/cursors/rainbow-bass.png?v=2">
    <link rel="icon" type="image/png" href="assets/cursors/rainbow-bass.png?v=2">
</head>
<body>
    <div id="container">
        <!-- Activities Screen -->
        <div id="activities-page" class="screen lake active">
            <a href="index.html" class="back-btn">← back</a>
            <div class="lake-title">
                <img src="assets/ui/What's there to do around.png" alt="Lake Title">
            </div>
            <div class="activities-container">
                <div class="activity-card">
                    <div class="activity-label">fishing</div>
                    <div class="activity-images">
                        <img src="liz-fish.png" alt="Liz fishing">
                        <img src="tristan-fish.png" alt="Tristan fishing">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">go for icecream</div>
                    <div class="activity-images">
                        <img src="ice-cream-1.png" alt="Ice cream">
                        <img src="ice-cream-2.png" alt="Ice cream">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">foraging</div>
                    <div class="activity-images">
                        <img src="blue-berries.png" alt="Blueberries">
                        <img src="forest-floor.png" alt="Forest floor">
                        <img src="raspberry.png" alt="Raspberry">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">boating</div>
                    <div class="activity-images">
                        <img src="sailing.png" alt="Sailing">
                        <img src="canoe.png" alt="Canoeing">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">swimming</div>
                    <div class="activity-images">
                        <img src="lake-sunset.png" alt="Lake sunset">
                        <img src="swimming.png" alt="Swimming">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">hiking</div>
                    <div class="activity-images">
                        <img src="forest.png" alt="Forest">
                        <img src="brochet.png" alt="Brochet">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">campfires</div>
                    <div class="activity-images">
                        <img src="campfire1.png" alt="Campfire">
                        <img src="dock-fire.png" alt="Dock fire">
                        <img src="woodstove.png" alt="Woodstove">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">stargazing</div>
                    <div class="activity-images">
                        <img src="stargazing1.png" alt="Stargazing">
                        <img src="stargazing2.png" alt="Stargazing">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">watersports</div>
                    <div class="activity-images">
                        <img src="water-ski.png" alt="Water skiing">
                        <img src="tubing.png" alt="Tubing">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">birdwatching</div>
                    <div class="activity-images">
                        <img src="blue-jay.png" alt="Blue jay">
                        <img src="hummingbird.png" alt="Hummingbird">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">off-roading</div>
                    <div class="activity-images">
                        <img src="atv1.png" alt="ATV">
                        <img src="atv2.png" alt="ATV">
                    </div>
                </div>
                <div class="activity-card">
                    <div class="activity-label">eat yummy pastries!</div>
                    <div class="activity-images">
                        <img src="croissant1.png" alt="Croissant">
                        <img src="croissant2.png" alt="Croissant">
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
