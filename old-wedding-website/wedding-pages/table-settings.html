<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Settings</title>
    <link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Caveat:wght@400;600;700&family=Indie+Flower&family=Patrick+Hand&family=Shadows+Into+Light&family=Permanent+Marker&family=Sometype+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Space Mono', monospace;
            background-color: #fffef7;
            background-image: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45)), url('../../assets/images/forest-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            color: #333;
            font-family: 'Space Mono', monospace;
            margin-bottom: 40px;
        }
        
        nav {
            text-align: center;
            margin: 20px 0 40px 0;
        }
        
        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #333;
            font-weight: 700;
            font-size: 1.1em;
            transition: color 0.3s ease;
        }
        
        nav a:hover {
            color: #888;
        }
        
        .content-section {
            background-color: rgba(245, 240, 230, 0.3);
            border-radius: 30px;
            padding: 40px 30px;
            margin-bottom: 60px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .item-card {
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(51, 51, 51, 0.2);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-color: #333;
            background-color: #fffef7;
        }
        
        .item-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
        }
        
        .item-description {
            font-size: 0.95em;
            color: #666;
            line-height: 1.6;
            flex-grow: 1;
        }
        
        .item-link {
            display: inline-block;
            padding: 10px 16px;
            background-color: rgba(51, 51, 51, 0.1);
            border: 2px solid #333;
            color: #333;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        .item-card:hover .item-link {
            background-color: #333;
            color: #fffef7;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="wedding-gallery.html">Gallery</a>
        <a href="wedding-axioms.html">Axioms</a>
    </nav>
    
    <h1>Table Settings</h1>
    
    <div class="content-section">
        <div class="section-title">Plan for Table Setting</div>
        <div class="items-grid" id="items-container">
            <div class="empty-message">Loading content...</div>
        </div>
    </div>
    
    <script>
        async function loadContent() {
            try {
                // Fetch the table-settings.txt file
                const response = await fetch('table-settings.txt');
                
                if (!response.ok) {
                    document.getElementById('items-container').innerHTML = '<div class="empty-message">No content file found. Create table-settings.txt in the same folder.</div>';
                    return;
                }
                
                const content = await response.text();
                const items = parseContent(content);
                
                if (items.length === 0) {
                    document.getElementById('items-container').innerHTML = '<div class="empty-message">No items found in content file.</div>';
                    return;
                }
                
                renderItems(items);
            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById('items-container').innerHTML = '<div class="empty-message">Error loading content.</div>';
            }
        }
        
        function parseContent(text) {
            // Format: Title | URL
            //         Description text
            //         ---
            
            const items = [];
            const blocks = text.split('---').map(b => b.trim()).filter(b => b);
            
            blocks.forEach(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                
                if (lines.length >= 2) {
                    const firstLine = lines[0];
                    const [title, url] = firstLine.split('|').map(s => s.trim());
                    
                    if (title && url) {
                        const description = lines.slice(1).join(' ');
                        items.push({
                            title: title,
                            url: url,
                            description: description
                        });
                    }
                }
            });
            
            return items;
        }
        
        function renderItems(items) {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('a');
                card.href = item.url;
                card.className = 'item-card';
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                
                card.innerHTML = `
                    <div class="item-title">${item.title}</div>
                    <div class="item-description">${item.description}</div>
                    <div class="item-link">View →</div>
                `;
                
                container.appendChild(card);
            });
        }
        
        // Load content on page load
        document.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
